<svg xmlns="http://www.w3.org/2000/svg" viewBox="-6.000 -124.200 212.000 148.400" width="100%" height="100%" class="cad-root w-full h-full font-mono select-none" id="cad-drawing-root">
  <defs>
    <style>
      :root, .cad-root {
        --cad-bg: #0a0a0c;
        --cad-wall-stroke: #ffffff;
        --cad-wall-fill: #18181b;
        --cad-glaze: #38bdf8;
        --cad-door: #cbd5e1;
        --cad-grid: #27272a;
        --cad-dim: #94a3b8;
        --cad-anno: #f8fafc;
        --cad-floor: #3f3f46;
        --cad-default: #71717a;
      }
      .cad-light {
        --cad-bg: #f8f9fa;
        --cad-wall-stroke: #0f172a;
        --cad-wall-fill: #e2e8f0;
        --cad-glaze: #0284c7;
        --cad-door: #475569;
        --cad-grid: #cbd5e1;
        --cad-dim: #475569;
        --cad-anno: #0f172a;
        --cad-floor: #64748b;
        --cad-default: #475569;
      }
      .cad-root { background-color: var(--cad-bg); font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      .cad-wall, .cad-glaze, .cad-door, .cad-grid, .cad-dim, .cad-anno, .cad-floor, .cad-default { transition: opacity 0.25s ease, stroke-width 0.2s ease; }
      
      /* 4-Tier AIA / ISO Architectural Line-Weight Standard */
      .cad-wall { stroke: var(--cad-wall-stroke); stroke-width: 1.3px; fill: none !important; stroke-linejoin: round; stroke-linecap: round; }
      .cad-wall polygon, .cad-wall polyline, .cad-wall line, .cad-wall path { fill: none !important; }
      .cad-wall-inner { stroke: var(--cad-wall-stroke); stroke-width: 0.95px; fill: none !important; stroke-linejoin: round; stroke-linecap: round; }
      .cad-glaze { stroke: var(--cad-glaze); stroke-width: 1.3px; fill: none !important; stroke-linecap: round; filter: drop-shadow(0 0 2px rgba(56, 189, 248, 0.4)); }
      .cad-door { stroke: var(--cad-door); stroke-width: 0.75px; stroke-dasharray: 4,3; fill: none !important; stroke-linecap: round; opacity: 0.85; }
      .cad-grid { stroke: var(--cad-grid); stroke-width: 0.4px; stroke-dasharray: 4,4; fill: none !important; opacity: 0.35; }
      .cad-dim { stroke: var(--cad-dim); stroke-width: 0.45px; fill: none !important; opacity: 0.35; transition: opacity 0.25s ease, stroke 0.2s ease; }
      .cad-dim text { stroke: none !important; fill: var(--cad-dim) !important; font-family: monospace; font-weight: 500; cursor: pointer; transition: fill 0.15s ease, font-weight 0.15s ease; }
      .cad-dim:hover, .cad-dim.active { opacity: 1 !important; }
      .cad-dim text:hover { fill: #ffffff !important; font-weight: bold; }
      .cad-dim line, .cad-dim polyline, .cad-dim path { stroke: var(--cad-dim); stroke-width: 0.45px; fill: none !important; opacity: 0.7; }
      .cad-dim:hover line, .cad-dim:hover polyline, .cad-dim:hover path { opacity: 1 !important; stroke-width: 0.75px; }
      
      .cad-anno { fill: var(--cad-anno) !important; stroke: none !important; font-family: monospace; }
      .cad-anno text { fill: var(--cad-anno) !important; stroke: none !important; font-family: monospace; font-weight: 600; letter-spacing: 0.04em; cursor: pointer; transition: fill 0.15s ease, transform 0.15s ease; }
      .cad-anno text:hover { fill: var(--cad-glaze) !important; font-weight: bold; }
      .cad-floor { stroke: var(--cad-floor); stroke-width: 0.6px; fill: none !important; stroke-linejoin: round; stroke-linecap: round; opacity: 0.55; }
      .cad-default { stroke: var(--cad-default); stroke-width: 0.55px; fill: none !important; opacity: 0.55; }
      
      /* Semantic Level-of-Detail (LOD) Dynamic Rules */
      .lod-macro .cad-dim { opacity: 0 !important; pointer-events: none; }
      .lod-macro .cad-grid { opacity: 0 !important; pointer-events: none; }
      .lod-macro .cad-floor { opacity: 0.25 !important; }
      .lod-detail .cad-dim { opacity: 0.45 !important; }
      .lod-detail .cad-door { opacity: 0.85 !important; }
      .lod-inspect .cad-dim { opacity: 0.95 !important; }
      .lod-inspect .cad-contractor-note { display: inline !important; opacity: 0.85; }
      
      /* Interactive Room Spatial Zone Highlighting */
      .cad-room-zone {
        cursor: pointer;
        stroke: transparent;
        stroke-width: 2.5px;
        fill: transparent;
        transition: stroke 0.2s ease, fill 0.2s ease, filter 0.2s ease;
      }
      .cad-room-zone:hover, .cad-room-zone.active {
        stroke: var(--cad-glaze) !important;
        fill: rgba(56, 189, 248, 0.12) !important;
        filter: drop-shadow(0 0 8px rgba(56, 189, 248, 0.5));
      }
      .cad-light .cad-room-zone:hover, .cad-light .cad-room-zone.active {
        stroke: var(--cad-glaze) !important;
        fill: rgba(2, 132, 199, 0.12) !important;
      }
      
      /* Contractor micro-notes are tucked away by default to ensure serene clarity */
      .cad-contractor-note {
        display: none !important;
        opacity: 0.7;
      }
      .show-technical .cad-contractor-note {
        display: inline !important;
      }
      
      /* Floating Architectural Room Typography */
      .cad-room-badge-group {
        cursor: pointer;
        pointer-events: all;
        transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1), filter 0.2s ease;
      }
      .cad-room-badge-group:hover, .cad-room-badge-group.active {
        transform: scale(1.08);
      }
      .cad-badge-plate {
        fill: rgba(14, 14, 18, 0.75);
        stroke: rgba(255, 255, 255, 0.15);
        stroke-width: 0.8px;
        transition: fill 0.2s ease, stroke 0.2s ease, filter 0.2s ease;
      }
      .cad-room-badge-group:hover .cad-badge-plate, .cad-room-badge-group.active .cad-badge-plate {
        fill: rgba(14, 14, 18, 0.95);
        stroke: #38bdf8;
        stroke-width: 1.2px;
        filter: drop-shadow(0 0 10px rgba(56, 189, 248, 0.6));
      }
      .cad-light .cad-badge-plate {
        fill: rgba(255, 255, 255, 0.88);
        stroke: rgba(0, 0, 0, 0.15);
        stroke-width: 0.8px;
      }
      .cad-light .cad-room-badge-group:hover .cad-badge-plate, .cad-light .cad-room-badge-group.active .cad-badge-plate {
        fill: #ffffff;
        stroke: #0284c7;
        filter: drop-shadow(0 0 8px rgba(2, 132, 199, 0.4));
      }
      .cad-badge-title {
        fill: #f8fafc;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 8.5px;
        font-weight: 700;
        letter-spacing: 0.06em;
      }
      .cad-light .cad-badge-title {
        fill: #0f172a;
      }
      .cad-badge-sub {
        fill: #94a3b8;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 6.5px;
        font-weight: 500;
        letter-spacing: 0.02em;
        opacity: 0.85;
      }
      .cad-light .cad-badge-sub {
        fill: #475569;
      }
      .cad-room-badge-group:hover .cad-badge-sub, .cad-room-badge-group.active .cad-badge-sub {
        fill: #38bdf8;
        opacity: 1;
        font-weight: 600;
      }
      .cad-light .cad-room-badge-group:hover .cad-badge-sub, .cad-light .cad-room-badge-group.active .cad-badge-sub {
        fill: #0284c7;
        opacity: 1;
      }
      
      /* Spotlight Hover Preview for drafting buttons */
      .spotlight-active .cad-layer:not(.cad-spotlight) { opacity: 0.12 !important; }
      .spotlight-active .cad-spotlight { opacity: 1 !important; filter: drop-shadow(0 0 4px rgba(56, 189, 248, 0.6)); }
    </style>
  </defs>
  <g id="layer-a-wall" class="cad-wall" data-layer="A-WALL">
    <polyline points="0.000,-0.000 200.000,-0.000 200.000,-120.000 0.000,-120.000 0.000,-0.000" fill="none" />
  </g>
  <g id="layer-a-glaz" class="cad-glaze" data-layer="A-GLAZ">
    <line x1="40.000" y1="-0.000" x2="160.000" y2="-0.000" />
  </g>
  <g id="layer-a-door" class="cad-door" data-layer="A-DOOR">
    <path d="M 120.000 -0.000 A 20.000 20.000 0 0 0 100.000 -20.000" fill="none" />
  </g>
  <g id="layer-s-grid" class="cad-grid" data-layer="S-GRID">
    <line x1="0.000" y1="-60.000" x2="200.000" y2="-60.000" />
  </g>
  <g id="layer-a-anno" class="cad-anno" data-layer="A-ANNO">
    <text x="80.000" y="-50.000" font-size="3.50" dominant-baseline="central" text-anchor="middle" data-label="LIVING AREA" class="cad-text-node">LIVING AREA</text>
  </g>
  <g id="layer-room-zones" class="cad-rooms">
