    <polygon id="zone-great-room" class="cad-room-zone" data-room-id="great-room" data-room-name="Great Room" data-dim="17&#x27;0&quot; × 17&#x27;8&quot;" data-area="300 SQ FT" points="-322.8,-341.4 -118.8,-341.4 -118.8,-129.4 -322.8,-129.4" />
    <polygon id="zone-dining" class="cad-room-zone" data-room-id="dining" data-room-name="Dining Room" data-dim="13&#x27;0&quot; × 10&#x27;11&quot;" data-area="142 SQ FT" points="-114.8,-341.4 41.2,-341.4 41.2,-210.0 -114.8,-210.0" />
    <polygon id="zone-kitchen" class="cad-room-zone" data-room-id="kitchen" data-room-name="Gourmet Kitchen" data-dim="13&#x27;0&quot; × 14&#x27;2&quot;" data-area="184 SQ FT" points="-114.8,-210.0 41.2,-210.0 41.2,-39.4 -114.8,-39.4" />
    <polygon id="zone-deck" class="cad-room-zone" data-room-id="deck" data-room-name="Cantilevered Deck" data-dim="11&#x27;1&quot; × 11&#x27;8&quot;" data-area="129 SQ FT" points="47.2,-320.0 180.0,-320.0 180.0,-180.0 47.2,-180.0" />
    <polygon id="zone-entry" class="cad-room-zone" data-room-id="entry" data-room-name="Main Entry &amp; Porch" data-dim="8&#x27;8&quot; × 10&#x27;5&quot;" data-area="90 SQ FT" points="-322.8,-125.4 -218.8,-125.4 -218.8,0.0 -322.8,0.0" />
    <polygon id="zone-master" class="cad-room-zone" data-room-id="master" data-room-name="Master Suite" data-dim="13&#x27;8&quot; × 14&#x27;0&quot;" data-area="191 SQ FT" points="-642.8,-341.4 -478.8,-341.4 -478.8,-173.4 -642.8,-173.4" />
    <polygon id="zone-master-bath" class="cad-room-zone" data-room-id="master-bath" data-room-name="Ensuite Bath &amp; W.I.C." data-dim="12&#x27;4&quot; × 14&#x27;0&quot;" data-area="172 SQ FT" points="-474.8,-341.4 -326.8,-341.4 -326.8,-173.4 -474.8,-173.4" />
    <polygon id="zone-bed2" class="cad-room-zone" data-room-id="bed2" data-room-name="Guest Bedroom 2" data-dim="13&#x27;8&quot; × 10&#x27;10&quot;" data-area="148 SQ FT" points="-642.8,-169.4 -478.8,-169.4 -478.8,-39.4 -642.8,-39.4" />
    <polygon id="zone-bed3" class="cad-room-zone" data-room-id="bed3" data-room-name="Guest Bedroom 3" data-dim="12&#x27;4&quot; × 10&#x27;10&quot;" data-area="133 SQ FT" points="-474.8,-169.4 -326.8,-169.4 -326.8,-39.4 -474.8,-39.4" />
  </g>
