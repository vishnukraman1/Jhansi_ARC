<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%" class="w-full h-full font-mono select-none" id="cad-drawing-root">
  <defs>
    <style>
      .cad-grid { stroke: #333333; stroke-width: 0.5px; stroke-dasharray: 4,4; fill: none; }
      .cad-grid-text { fill: #666666; font-size: 10px; font-family: monospace; text-anchor: middle; dominant-baseline: central; }
      .cad-grid-bubble { fill: #1a1a1a; stroke: #444444; stroke-width: 0.75px; }
      
      .cad-wall { stroke: #ffffff; stroke-width: 2.5px; fill: #181818; stroke-linejoin: round; }
      .cad-wall-inner { stroke: #ffffff; stroke-width: 1.5px; fill: #181818; stroke-linejoin: round; }
      
      .cad-glaze { stroke: #3b82f6; stroke-width: 1.5px; fill: none; }
      .cad-door { stroke: #a3a3a3; stroke-width: 1px; fill: none; }
      
      .cad-dim { stroke: #737373; stroke-width: 0.75px; fill: #737373; }
      .cad-dim-text { fill: #888888; font-size: 9px; font-family: monospace; text-anchor: middle; dominant-baseline: central; }
      
      .cad-anno { fill: #a3a3a3; font-family: monospace; }
      .cad-anno-title { fill: #f7f7f5; font-size: 11px; font-weight: bold; }
      .cad-anno-sub { fill: #737373; font-size: 8px; }
    </style>
  </defs>

  <!-- Structural Grid Layer -->
  <g id="layer-grid" class="cad-grid-layer cad-grid" data-layer="GRID">
    <!-- Grid Lines X -->
    <line x1="120" y1="60" x2="120" y2="520" class="cad-grid" />
    <line x1="280" y1="60" x2="280" y2="520" class="cad-grid" />
    <line x1="440" y1="60" x2="440" y2="520" class="cad-grid" />
    <line x1="600" y1="60" x2="600" y2="520" class="cad-grid" />

    <!-- Grid Lines Y -->
    <line x1="80" y1="120" x2="680" y2="120" class="cad-grid" />
    <line x1="80" y1="260" x2="680" y2="260" class="cad-grid" />
    <line x1="80" y1="400" x2="680" y2="400" class="cad-grid" />

    <!-- Grid Column Bubbles (Top) -->
    <circle cx="120" cy="50" r="10" class="cad-grid-bubble" />
    <text x="120" y="50" class="cad-grid-text">A</text>
    <circle cx="280" cy="50" r="10" class="cad-grid-bubble" />
    <text x="280" y="50" class="cad-grid-text">B</text>
    <circle cx="440" cy="50" r="10" class="cad-grid-bubble" />
    <text x="440" y="50" class="cad-grid-text">C</text>
    <circle cx="600" cy="50" r="10" class="cad-grid-bubble" />
    <text x="600" y="50" class="cad-grid-text">D</text>

    <!-- Grid Row Bubbles (Left) -->
    <circle cx="65" cy="120" r="10" class="cad-grid-bubble" />
    <text x="65" y="120" class="cad-grid-text">1</text>
    <circle cx="65" cy="260" r="10" class="cad-grid-bubble" />
    <text x="65" y="260" class="cad-grid-text">2</text>
    <circle cx="65" cy="400" r="10" class="cad-grid-bubble" />
    <text x="65" y="400" class="cad-grid-text">3</text>
  </g>

  <!-- Architectural Walls Layer -->
  <g id="layer-walls" class="cad-wall-layer">
    <!-- Outer Envelope -->
    <rect x="120" y="120" width="480" height="280" class="cad-wall" />

    <!-- Interior Partitions -->
    <line x1="280" y1="120" x2="280" y2="400" class="cad-wall-inner" />
    <line x1="440" y1="120" x2="440" y2="280" class="cad-wall-inner" />
    <line x1="440" y1="280" x2="600" y2="280" class="cad-wall-inner" />
  </g>

  <!-- Architectural Glazing Layer -->
  <g id="layer-glazing" class="cad-glaze-layer">
    <!-- North Ribbon Windows -->
    <line x1="160" y1="120" x2="240" y2="120" class="cad-glaze" />
    <line x1="320" y1="120" x2="400" y2="120" class="cad-glaze" />
    <line x1="480" y1="120" x2="560" y2="120" class="cad-glaze" />
    <!-- South Panoramic Glazing -->
    <line x1="160" y1="400" x2="240" y2="400" class="cad-glaze" />
    <line x1="300" y1="400" x2="420" y2="400" class="cad-glaze" />
    <!-- East Glass Facade -->
    <line x1="600" y1="160" x2="600" y2="240" class="cad-glaze" />
  </g>

  <!-- Doors & Openings Layer -->
  <g id="layer-doors" class="cad-door-layer">
    <!-- Main Entrance Door -->
    <path d="M280,320 A40,40 0 0,1 320,360" class="cad-door" />
    <line x1="280" y1="320" x2="280" y2="360" class="cad-door" />

    <!-- Bedroom Suite Door -->
    <path d="M440,200 A30,30 0 0,0 410,230" class="cad-door" />
    <line x1="440" y1="200" x2="440" y2="230" class="cad-door" />
  </g>

  <!-- Dimensions Layer -->
  <g id="layer-dimensions" class="cad-dim-layer cad-dim" data-layer="DIM">
    <!-- Overall Top Dimension -->
    <line x1="120" y1="90" x2="600" y2="90" class="cad-dim" />
    <line x1="120" y1="82" x2="120" y2="98" class="cad-dim" />
    <line x1="600" y1="82" x2="600" y2="98" class="cad-dim" />
    <text x="360" y="80" class="cad-dim-text">24.00 m (OVERALL WIDTH)</text>

    <!-- Overall Left Dimension -->
    <line x1="95" y1="120" x2="95" y2="400" class="cad-dim" />
    <line x1="87" y1="120" x2="103" y2="120" class="cad-dim" />
    <line x1="87" y1="400" x2="103" y2="400" class="cad-dim" />
    <text x="90" y="260" class="cad-dim-text" transform="rotate(-90, 90, 260)">14.00 m</text>

    <!-- Bay Dimensions -->
    <line x1="120" y1="430" x2="280" y2="430" class="cad-dim" />
    <line x1="120" y1="425" x2="120" y2="435" class="cad-dim" />
    <line x1="280" y1="425" x2="280" y2="435" class="cad-dim" />
    <text x="200" y="445" class="cad-dim-text">8.00 m</text>

    <line x1="280" y1="430" x2="440" y2="430" class="cad-dim" />
    <line x1="440" y1="425" x2="440" y2="435" class="cad-dim" />
    <text x="360" y="445" class="cad-dim-text">8.00 m</text>

    <line x1="440" y1="430" x2="600" y2="430" class="cad-dim" />
    <line x1="600" y1="425" x2="600" y2="435" class="cad-dim" />
    <text x="520" y="445" class="cad-dim-text">8.00 m</text>
  </g>

  <!-- Annotations Layer -->
  <g id="layer-annotations" class="cad-anno-layer cad-anno" data-layer="ANNO">
    <!-- Room 1: Living Area -->
    <g transform="translate(200, 240)">
      <text x="0" y="0" class="cad-anno-title" text-anchor="middle">01. LIVING PAVILION</text>
      <text x="0" y="16" class="cad-anno-sub" text-anchor="middle">AREA: 64.0 m² | CLR HT: 3.20m</text>
    </g>

    <!-- Room 2: Kitchen / Dining -->
    <g transform="translate(360, 240)">
      <text x="0" y="0" class="cad-anno-title" text-anchor="middle">02. KITCHEN &amp; ATRIUM</text>
      <text x="0" y="16" class="cad-anno-sub" text-anchor="middle">AREA: 48.0 m² | PASSIVE GAIN</text>
    </g>

    <!-- Room 3: Master Suite -->
    <g transform="translate(520, 200)">
      <text x="0" y="0" class="cad-anno-title" text-anchor="middle">03. MASTER SUITE</text>
      <text x="0" y="16" class="cad-anno-sub" text-anchor="middle">AREA: 38.4 m²</text>
    </g>

    <!-- Room 4: Studio Workspace -->
    <g transform="translate(520, 340)">
      <text x="0" y="0" class="cad-anno-title" text-anchor="middle">04. STUDIO / GALLERY</text>
      <text x="0" y="16" class="cad-anno-sub" text-anchor="middle">AREA: 28.8 m²</text>
    </g>

    <!-- North Arrow Symbol -->
    <g transform="translate(720, 100)" stroke="#ffffff" stroke-width="1" fill="none">
      <circle cx="0" cy="0" r="16" stroke="#444444" />
      <line x1="0" y1="12" x2="0" y2="-16" />
      <polygon points="0,-16 -4,-4 4,-4" fill="#ffffff" stroke="none" />
      <text x="-4" y="26" class="cad-anno-title">N</text>
    </g>
  </g>
</svg>
